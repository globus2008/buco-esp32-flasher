            border: 1px solid #d1d5db;

            color: #fff;
        }

            background: #fff;
            border: 1px solid #e5e7eb;

            padding: 20px 24px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
        ol { margin: 0; padding-left: 22px; }
        li { margin-bottom: 8px; }
        li:last-child { margin-bottom: 0; }

            background: #eef1f4;
            border-radius: 4px;
            padding: 1px 6px;

            font-size: 0.9em;
        }
        .note { font-size: 0.88rem; color: #6b7280; margin-top: 12px; }
        .warn {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-top: 14px;

        .changelog-entry h3 { font-size: 0.95rem; margin: 0 0 6px; }

            white-space: pre-wrap;
            margin: 6px 0 0 4px;
            padding: 8px 12px;
            background: #f9fafb;
            border-left: 3px solid #e5e7eb;
            font-size: 0.85rem;
            color: #374151;

            background: #fff;
            border-radius: 6px;
            padding: 8px 16px;

    <div class="wrap">

            <h1>BUCO ESP32 &mdash; Firmware Installer</h1>
            <div class="lang-switch" id="lang-switch"></div>
        </div>
        <p class="subtitle" data-i18n="subtitle"></p>

                <li data-i18n="req1"></li>
                <li data-i18n="req2"></li>
                <li data-i18n="req3"></li>
            </ol>

             (data/legal/, synced into legal/ by scripts/publish_flasher.py). It must be
             scrolled to the end and accepted on every visit before the install button
             appears - deliberately not remembered in localStorage. -->

            <h2 data-i18n="disclaimerTitle"></h2>
            <p class="note" style="margin-top:0;" data-i18n="disclaimerIntro"></p>

            <p class="note" id="disclaimer-scroll-hint" data-i18n="disclaimerScrollHint"></p>

                <input type="checkbox" id="disclaimer-accept" disabled>
                <span data-i18n="disclaimerAccept"></span>
            </label>
        </div>

        <div class="card install-area">
            <h2 data-i18n="installTitle"></h2>
            <p data-i18n="installIntro"></p>
            <div class="install-locked" id="install-locked" data-i18n="installLocked"></div>
            <div id="install-button-wrap" hidden>
                <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
            </div>
            <p class="note" data-i18n="installNote"></p>
            <div class="warn" data-i18n="installWarn"></div>
        </div>

        <div class="card">
            <h2 data-i18n="afterTitle"></h2>
            <ol>
                <li data-i18n="after1"></li>
                <li data-i18n="after2"></li>
            </ol>
        </div>

        <div class="card">

            <ol>
                <li data-i18n="upd1"></li>
                <li data-i18n="upd2"></li>
            </ol>
        </div>

        <div class="card" id="changelog-card">

            <p class="note"><span data-i18n="currentVersionLabel"></span> <span id="changelog-version-value"></span></p>

            <p class="note" id="changelog-unavailable" style="display:none;" data-i18n="changelogUnavailable"></p>
            <button type="button" id="changelog-more-btn" class="more-btn" style="display:none;" data-i18n="showMoreButton"></button>
        </div>
    </div>

        const LANGS = ['en', 'cs', 'de', 'fr', 'hr', 'hu', 'pl', 'sk'];

        function detectLang() {
            const saved = localStorage.getItem('flasher-lang');
            if (saved && LANGS.includes(saved)) return saved;
            const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
            return LANGS.includes(nav) ? nav : 'en';
        }

        // Disclaimer languages published under legal/ (LEGAL_FILES in
        // scripts/publish_flasher.py) - today all of LANGS; a language added
        // later without its own text falls back to English with a note.
        const DISCLAIMER_LANGS = ['en', 'cs', 'de', 'fr', 'hr', 'hu', 'pl', 'sk'];
        let disclaimerLang = null;

        function disclaimerReachedEnd() {
            const box = document.getElementById('disclaimer-text');
            return box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
        }

        function updateDisclaimerGate() {
            const box = document.getElementById('disclaimer-text');
            const cb = document.getElementById('disclaimer-accept');
            const label = document.getElementById('disclaimer-accept-label');
            const loaded = box.dataset.loaded === '1';
            if (loaded && disclaimerReachedEnd()) {
                cb.disabled = false;
                label.classList.remove('disabled');
                document.getElementById('disclaimer-scroll-hint').style.display = 'none';
            }
            const accepted = cb.checked && !cb.disabled;
            document.getElementById('install-button-wrap').hidden = !accepted;
            document.getElementById('install-locked').style.display = accepted ? 'none' : '';
        }

        function loadDisclaimer(lang) {
            const fileLang = DISCLAIMER_LANGS.includes(lang) ? lang : 'en';
            if (lang === disclaimerLang) return;
            disclaimerLang = lang;
            const box = document.getElementById('disclaimer-text');
            fetch('legal/disclaimer-' + fileLang + '.html', { cache: 'no-cache' })
                .then((r) => {
                    if (!r.ok) throw new Error('disclaimer ' + r.status);
                    return r.text();
                })
                .then((html) => {
                    if (disclaimerLang !== lang) return; // a newer language won
                    // Same-origin file from this repo's own legal/ folder (trusted).
                    const fallback = fileLang !== lang
                        ? '<p><em>' + I18N[lang].disclaimerFallback + '</em></p>' : '';
                    box.innerHTML = fallback + html;
                    box.dataset.loaded = '1';
                    updateDisclaimerGate();
                })
                .catch(() => {
                    box.dataset.loaded = '0';
                    box.innerHTML = '<p style="color:#b91c1c;">' + I18N[lang].disclaimerLoadFailed + '</p>';
                    disclaimerLang = null;
                    updateDisclaimerGate();
                });
        }

        document.getElementById('disclaimer-text').addEventListener('scroll', updateDisclaimerGate);
        document.getElementById('disclaimer-accept').addEventListener('change', updateDisclaimerGate);
        window.addEventListener('resize', updateDisclaimerGate);

        function applyLang(lang) {
            const dict = I18N[lang];
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const value = dict[el.getAttribute('data-i18n')];
                if (value !== undefined) el.innerHTML = value;
            });
            document.querySelectorAll('#lang-switch button').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            localStorage.setItem('flasher-lang', lang);
            loadDisclaimer(lang);
        }

        const switchEl = document.getElementById('lang-switch');
        LANGS.forEach((lang) => {
            const btn = document.createElement('button');
            btn.textContent = lang.toUpperCase();
            btn.dataset.lang = lang;
            btn.addEventListener('click', () => applyLang(lang));
            switchEl.appendChild(btn);
        });

        applyLang(detectLang());

        // Changelog: changelog-full.json is the unbounded counterpart to the
        // small changelog.json the device firmware itself reads (that one
        // stays capped at 10 notes total for the device's fixed 4KB parse
        // buffer - see CLAUDE.md's "Firmware distribution" section and
        // scripts/publish_flasher.py). Fetched from this same GitHub Pages
        // origin, so there's no CORS concern. Shown newest-first, revealed
        // one release at a time initially and 25 more per click - a long
        // history never dumps onto the page all at once.
        const CHANGELOG_FIRST_BATCH = 1;
        const CHANGELOG_PAGE_SIZE = 25;
        let changelogEntries = [];
        let changelogShown = 0;

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        // A note is either the current {summary, body} shape or a legacy
        // plain string (older already-published entries) - normalize both,
        // mirroring scripts/changelog_notes.py's note_summary()/note_body().
        function noteSummary(note) {
            return (note && typeof note === 'object') ? (note.summary || '') : String(note);
        }
        function noteBody(note) {
            return (note && typeof note === 'object') ? (note.body || '') : '';
        }

        // A body renders as a native <details>/<summary> - expandable on
        // click, no extra JS needed beyond this string build.
        function renderNote(note) {
            const summary = escapeHtml(noteSummary(note));
            const body = noteBody(note);
            if (!body) return '<li>' + summary + '</li>';
            return '<li><details><summary>' + summary + '</summary><div class="note-body">' +
                escapeHtml(body) + '</div></details></li>';
        }

        function renderChangelogList() {
            document.getElementById('changelog-list').innerHTML = changelogEntries
                .slice(0, changelogShown)
                .map((entry) => {
                    const notes = (entry.notes || []).map(renderNote).join('');
                    return '<div class="changelog-entry"><h3>v' + escapeHtml(entry.version) +
                        ' <span class="date">&mdash; ' + escapeHtml(entry.date) + '</span></h3><ul>' +
                        notes + '</ul></div>';
                })
                .join('');
            document.getElementById('changelog-more-btn').style.display =
                changelogShown < changelogEntries.length ? '' : 'none';
        }

        document.getElementById('changelog-more-btn').addEventListener('click', () => {
            changelogShown = Math.min(changelogShown + CHANGELOG_PAGE_SIZE, changelogEntries.length);
            renderChangelogList();
        });

        fetch('manifest.json')
            .then((r) => r.json())
            .then((data) => {
                document.getElementById('changelog-version-value').textContent = data.version || '';
            })
            .catch(() => {});

        fetch('changelog-full.json')
            .then((r) => {
                if (!r.ok) throw new Error('changelog fetch failed');
                return r.json();
            })
            .then((data) => {
                changelogEntries = (data && data.entries) || [];
                changelogShown = Math.min(CHANGELOG_FIRST_BATCH, changelogEntries.length);
                renderChangelogList();
            })
            .catch(() => {
                document.getElementById('changelog-unavailable').style.display = '';
            });
    </script>
